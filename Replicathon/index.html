<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Planet
    </title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="topleft">
            <img class="logo" src="./assets/logo1.png" alt="">
        </div>
        <div class="topright">
            <p class="text1">Home</p>
            <p class="text1">Products</p>
            <p class="text1">Contact</p>
            <button class="placeorder">Place Order<img class="orderimage" src="./assets/placeOrder.svg" alt=""></button>
        </div>
    </nav>
    <section class="custom">
        <button id="Products">Products</button>
        <button id="Custom">Custom</button>
    </section>
    <section class="mid">
        <div id="left">
            <h1 id="head">FIND YOUR<br>GREATNESS</h1><br>
            <p id="para">Built for speed and confidence,<br>every pair combines premium<br>materials and bold design.<br>Engineered for comfort, made for<br>movement.</p>
        </div>
        <div id="mid">
            <p>HYPE</p>
            <img class="shoe" src="./assets/shoe.png" alt="">
        </div>
        <div id="right">
            <div class="choose">
                <p id="choose">Choose Your Color</p>
            </div>
            <div class="color">
                <button id="blue"></button>
                <button id="orange"></button>
                <button id="red"></button>
            </div>
            <div class="size">
                <button id="first">40</button>
                <button id="second">42</button>
                <button id="third">44</button>
            </div>
        </div>
    </section>
    <footer class="bottom">
        <div class="links">
            <a href="https://instagram.com" target="_blank">
                <img class="link" src="./assets/instagram.svg" alt="">
            </a>
            <a href="https://facebook.com" target="_blank">
                <img class="link" src="./assets/facebook.svg" alt="">
            </a>
            <a href="https://pinterest.com" target="_blank">
                <img class="link" src="./assets/pinterest.svg" alt="">
            </a>
            <a href="https://youtube.com" target="_blank">
                <img class="link" src="./assets/youtube.svg" alt="">
            </a>
        </div>
        <div class="more">
            <span class="dash"></span>
            <p> SNEAKERS FOR MORE </p>
            <span class="dash"></span>
        </div>
        <div class="all">
            <button id="all">See all Products<img id="arrow" src="./assets/arrow.svg"></button>
        </div>
    </footer>
</body>
</html>
